<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vernacraft-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#vernacraft-grad)" />
  
  <!-- Subtle glowing rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="12 12" />
  
  <!-- Inner White Card / Shield -->
  <g filter="url(#shadow)">
    <!-- Open Book / Bridge Metaphor -->
    <path d="M120 340 C 180 310, 230 330, 256 360 C 282 330, 332 310, 392 340 L 392 200 C 332 170, 282 190, 256 220 C 230 190, 180 170, 120 200 Z" fill="#ffffff" />
    
    <!-- Central Spine Divider -->
    <line x1="256" y1="220" x2="256" y2="360" stroke="#0d9488" stroke-width="4" stroke-linecap="round" />
    
    <!-- Left Page Accent: Vernacular Script Motifs (Devanagari / Ol Chiki vibe) -->
    <path d="M150 230 Q 185 220 220 235" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M150 255 Q 185 245 220 260" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M150 280 Q 185 270 220 285" stroke="#0284c7" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Right Page Accent: Sound Wave / Translation Arc -->
    <path d="M292 235 Q 327 220 362 230" stroke="#16a34a" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M292 260 Q 327 245 362 255" stroke="#16a34a" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M292 285 Q 327 270 362 280" stroke="#16a34a" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Sprouting Seedling / Leaf representing Foundational Primary Learning -->
    <path d="M256 210 C 240 160 210 140 180 150 C 180 180 210 200 256 210 Z" fill="#4ade80" />
    <path d="M256 210 C 272 160 302 140 332 150 C 332 180 302 200 256 210 Z" fill="#22c55e" />
    
    <!-- Rising Sun / Knowledge Radiance -->
    <circle cx="256" cy="130" r="28" fill="#facc15" />
    <path d="M256 90 L256 76 M220 102 L210 92 M292 102 L302 92 M200 130 L186 130 M312 130 L326 130" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
